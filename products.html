<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — ShopWave</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">ShopWave</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html" class="active">Products</a>
        <a href="cart.html">Cart <span class="cart-count" id="nav-count">0</span></a>
      </nav>
      <button class="menu-btn" id="menu-btn" aria-label="menu">&#9776;</button>
    </div>
    <div class="mobile-nav" id="mobile-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
    </div>
  </header>

  <div class="page-header">
    <div class="container">
      <h1>All Products</h1>
    </div>
  </div>

  <section class="products-page">
    <div class="container products-layout">

      <!-- FILTERS SIDEBAR -->
      <aside class="filters">
        <h3>Filter</h3>
        <div class="filter-group">
          <label>Category</label>
          <div class="filter-options" id="cat-filters"></div>
        </div>
        <div class="filter-group">
          <label>Sort by</label>
          <select id="sort-select">
            <option value="default">Default</option>
            <option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option>
            <option value="rating">Top Rated</option>
          </select>
        </div>
      </aside>

      <!-- GRID -->
      <div class="products-main">
        <div class="products-toolbar">
          <span id="result-count"></span>
        </div>
        <div class="product-grid" id="all-grid"></div>
      </div>

    </div>
  </section>

  <footer class="footer">
    <div class="footer-bottom">© 2026 ShopWave. All rights reserved.</div>
  </footer>

  <script src="app.js"></script>
  <script>
    const catFilters = document.getElementById('cat-filters');
    const allGrid = document.getElementById('all-grid');
    const sortSelect = document.getElementById('sort-select');
    const resultCount = document.getElementById('result-count');

    let activeCategory = new URLSearchParams(location.search).get('cat') || 'All';

    // Build category buttons
    categories.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn' + (c === activeCategory ? ' active' : '');
      btn.textContent = c;
      btn.onclick = () => {
        activeCategory = c;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      };
      catFilters.appendChild(btn);
    });

    sortSelect.onchange = render;

    function render() {
      let list = activeCategory === 'All' ? [...products] : products.filter(p => p.category === activeCategory);
      const sort = sortSelect.value;
      if (sort === 'price-asc') list.sort((a,b) => a.price - b.price);
      if (sort === 'price-desc') list.sort((a,b) => b.price - a.price);
      if (sort === 'rating') list.sort((a,b) => b.rating - a.rating);
      resultCount.textContent = list.length + ' products';
      allGrid.innerHTML = list.map(productCard).join('');
    }

    render();
    updateCartCount();
  </script>
</body>
</html>
